<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manajemen Inventaris & Buku</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM (Development UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body { font-family: 'Inter', sans-serif; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        // --- CONFIGURATION ---
        const API_URL = "https://script.google.com/macros/s/AKfycby0AguiPkCCQdHKh2jk7K3GsuzoigWYoY44HRr33N3O-oofo1kb_HK74a49dfOgeFowhw/exec";
        const ADMIN_PASSWORD = "admin123";
        const GURU_LIST = [
          "Indah Sari, S.Pd., M.Pd.", "Rosnina Ruslan, S.Pd.", "Vivi Angraeni, S.Pd.", "Wahdania, S.Pd.", 
          "Nur Fitriani, S.Pd.I", "Anriana, S.Pd.", "Nur Asura, S.Pd.", "Rifka Mulyani Jamil, S.Pd.", 
          "Muhammad Rate, S.Pd.", "A. Fifin Kamriani, S.P.", "Zahra Karimah Tunnisa, S.Pd.", 
          "Nur Ariani Amir, S.Pd.", "Siswandi Zikrullah", "La Ode Hermawan Rauf, S.Pd.", "Hasanuddin, S.Pd.", 
          "Haaniyah Bintu Kasman, S.Pd.", "Darmawati Saleh, S.Pd.", "M. Alimin, S.Pd.I.", "Soekarno, S.Pd.", 
          "Sumarni, S.Pd.", "Nurfatia, S.Hum.", "Muhammad Asrar Idrus, S.Pd.", "Sri Nikmayanti, S.Pd.", 
          "Muhammad Rusdi Syam, S.E.", "Nur Fadillah Musfira, S.Pd.", "M. Anshar Gaffar, S.Sos.", 
          "Alwi Firsadi, S.Kom."
        ];

        // --- DATABASE SERVICE (INDEXEDDB) ---
        const DB_NAME = 'InventarisSekolahDB';
        const DB_VERSION = 2; 
        const STORES = ['lcd', 'laptop', 'pengajuan', 'bukuSisa', 'bukuHarga'];

        const LocalDB = {
            db: null,

            open: () => {
                return new Promise((resolve, reject) => {
                    if (LocalDB.db) return resolve(LocalDB.db);
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        STORES.forEach(store => {
                            if (!db.objectStoreNames.contains(store)) {
                                db.createObjectStore(store, { keyPath: 'id' });
                            }
                        });
                        // Create Queue Store for Sync
                        if (!db.objectStoreNames.contains('syncQueue')) {
                            db.createObjectStore('syncQueue', { keyPath: 'queueId', autoIncrement: true });
                        }
                    };

                    request.onsuccess = (event) => {
                        LocalDB.db = event.target.result;
                        resolve(LocalDB.db);
                    };
                    request.onerror = (event) => reject(event.target.error);
                });
            },

            // --- CRUD Operations (Local Only + Queue) ---

            getAll: async () => {
                const db = await LocalDB.open();
                const result = {};
                const tx = db.transaction([...STORES, 'syncQueue'], 'readonly');

                await Promise.all(STORES.map(storeName => new Promise(resolve => {
                    tx.objectStore(storeName).getAll().onsuccess = (e) => {
                        let items = e.target.result || [];
                        
                        // FIX: Sort items by _sortIndex to match Google Sheet order
                        // Items without _sortIndex (newly added locally) go to the bottom
                        items.sort((a, b) => {
                            const indexA = a._sortIndex !== undefined ? a._sortIndex : 999999;
                            const indexB = b._sortIndex !== undefined ? b._sortIndex : 999999;
                            return indexA - indexB;
                        });

                        result[storeName] = items;
                        resolve();
                    };
                })));
                
                // Get Queue count for UI
                return new Promise(resolve => {
                    tx.objectStore('syncQueue').count().onsuccess = (e) => {
                        result.queueCount = e.target.result;
                        resolve(result);
                    };
                });
            },

            // Create: Add to store & Queue
            add: async (storeName, data) => {
                const db = await LocalDB.open();
                // New items don't have _sortIndex initially, so they will appear at bottom
                const newItem = { ...data, id: data.id || crypto.randomUUID(), _synced: false };
                const tx = db.transaction([storeName, 'syncQueue'], 'readwrite');
                
                tx.objectStore(storeName).put(newItem);
                tx.objectStore('syncQueue').add({
                    action: 'create',
                    type: storeName,
                    payload: newItem,
                    timestamp: Date.now()
                });

                return new Promise(resolve => tx.oncomplete = () => resolve(newItem));
            },

            // Update: Update store & Queue
            put: async (storeName, data) => {
                const db = await LocalDB.open();
                const tx = db.transaction([storeName, 'syncQueue'], 'readwrite');
                
                tx.objectStore(storeName).put(data);
                tx.objectStore('syncQueue').add({
                    action: 'update',
                    type: storeName,
                    payload: data,
                    timestamp: Date.now()
                });

                return new Promise(resolve => tx.oncomplete = () => resolve(data));
            },

            // Delete: Remove from store & Queue
            delete: async (storeName, id) => {
                const db = await LocalDB.open();
                const tx = db.transaction([storeName, 'syncQueue'], 'readwrite');
                
                tx.objectStore(storeName).delete(id);
                tx.objectStore('syncQueue').add({
                    action: 'delete',
                    type: storeName,
                    id: id,
                    timestamp: Date.now()
                });

                return new Promise(resolve => tx.oncomplete = () => resolve(true));
            },

            // Bulk Save (From Server to Local)
            mergeServerData: async (serverData) => {
                const db = await LocalDB.open();
                const tx = db.transaction([...STORES, 'syncQueue'], 'readwrite');
                
                // 1. Get all pending IDs from Queue
                const queueRequest = tx.objectStore('syncQueue').getAll();
                
                return new Promise(resolve => {
                    queueRequest.onsuccess = async () => {
                        const queueItems = queueRequest.result;
                        const pendingIds = new Set(queueItems.map(q => q.payload?.id || q.id));

                        STORES.forEach(storeName => {
                            if (serverData[storeName]) {
                                const store = tx.objectStore(storeName);
                                
                                // Strategy: Clear Store then Re-add with Order
                                store.clear().onsuccess = () => {
                                    // Add Server Data with Index
                                    serverData[storeName].forEach((item, index) => {
                                        if (!pendingIds.has(item.id)) {
                                            // FIX: Inject _sortIndex based on server array order
                                            item._sortIndex = index;
                                            store.put(item);
                                        }
                                    });
                                };
                            }
                        });
                        resolve(true);
                    };
                });
            },
            
            getQueue: async () => {
                const db = await LocalDB.open();
                return new Promise(resolve => {
                    const tx = db.transaction('syncQueue', 'readonly');
                    tx.objectStore('syncQueue').getAll().onsuccess = (e) => resolve(e.target.result);
                });
            },

            shiftQueue: async (queueId) => {
                const db = await LocalDB.open();
                const tx = db.transaction('syncQueue', 'readwrite');
                tx.objectStore('syncQueue').delete(queueId);
                return new Promise(resolve => tx.oncomplete = () => resolve());
            }
        };

        // --- API SERVICE (Raw) ---
        const apiRequest = async (action, payload) => {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action, ...payload }),
                });
                return await response.json();
            } catch (error) {
                console.error("API Network Error:", error);
                throw error;
            }
        };

        // --- SYNC SERVICE ---
        const SyncService = {
            isSyncing: false,
            
            processQueue: async (onQueueChange) => {
                if (SyncService.isSyncing) return;
                
                if (!navigator.onLine) return;

                const queue = await LocalDB.getQueue();
                if (queue.length === 0) return;

                SyncService.isSyncing = true;
                if (onQueueChange) onQueueChange(queue.length);

                try {
                    const item = queue[0];
                    console.log("Syncing item:", item);

                    let result;
                    if (item.action === 'create') {
                        result = await apiRequest('create', { type: item.type, data: item.payload });
                    } else if (item.action === 'update') {
                        result = await apiRequest('update', { type: item.type, data: item.payload });
                    } else if (item.action === 'delete') {
                        result = await apiRequest('delete', { type: item.type, id: item.id });
                    }

                    if (result && result.status === 'success') {
                        await LocalDB.shiftQueue(item.queueId);
                        SyncService.isSyncing = false;
                        SyncService.processQueue(onQueueChange); 
                    } else {
                        console.warn("Server returned error, keeping in queue:", result);
                        SyncService.isSyncing = false;
                    }

                } catch (e) {
                    console.error("Sync failed (likely offline):", e);
                    SyncService.isSyncing = false;
                } finally {
                     const remaining = await LocalDB.getQueue();
                     if (onQueueChange) onQueueChange(remaining.length);
                }
            }
        };

        // --- HELPER COMPONENTS ---
        const Table = ({ data, columns, actions, emptyMessage = "Tidak ada data." }) => {
            if (data.length === 0) return <div className="p-8 text-center text-gray-500 border rounded-lg bg-white text-sm">{emptyMessage}</div>;
            return (
                <div className="overflow-x-auto shadow-sm border rounded-lg">
                    <table className="w-full text-sm text-left text-gray-500">
                        <thead className="text-xs text-white uppercase bg-indigo-600">
                            <tr>
                                {columns.map((col, idx) => <th key={idx} className={`px-3 py-2 md:px-6 md:py-3 whitespace-nowrap ${col.className || ''}`}>{col.header}</th>)}
                                {actions && <th className="px-3 py-2 md:px-6 md:py-3 text-right whitespace-nowrap">Aksi</th>}
                            </tr>
                        </thead>
                        <tbody className="bg-white divide-y divide-gray-200">
                            {data.map((item, index) => (
                                <tr key={item.id || index} className="hover:bg-gray-50">
                                    {columns.map((col, idx) => <td key={idx} className="px-2 py-2 md:px-6 md:py-4 whitespace-nowrap font-medium text-gray-900">{col.accessor(item)}</td>)}
                                    {actions && <td className="px-2 py-2 md:px-6 md:py-4 text-right whitespace-nowrap space-x-2">{actions(item)}</td>}
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4">
                    <div className="bg-white rounded-lg shadow-xl w-full max-w-md overflow-hidden transform transition-all max-h-[90vh] flex flex-col">
                        <div className="px-6 py-4 border-b flex justify-between items-center shrink-0">
                            <h3 className="text-lg font-bold text-gray-900">{title}</h3>
                            <button onClick={onClose} className="text-gray-400 hover:text-gray-500"><svg className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg></button>
                        </div>
                        <div className="p-6 overflow-y-auto">{children}</div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const formatDate = (dateStr) => {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return dateStr; 
            return new Intl.DateTimeFormat('id-ID').format(date);
        };
        const formatCurrency = (value) => {
            if (!value) return 'Rp. 0';
            const clean = String(value).replace(/\D/g, '');
            return 'Rp. ' + clean.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        };
        const formatJam = (val) => {
            if (!val) return '-';
            const strVal = String(val);
            if (strVal.match(/^\d{4}-\d{2}-\d{2}T/)) return formatDate(strVal); 
            return strVal;
        };
        const sortLaptopUnits = (a, b) => {
            const getNum = (str) => {
                if (!str) return 0;
                const match = str.match(/(\d+)/);
                return match ? parseInt(match[0], 10) : 0;
            };
            return getNum(a.laptopKe) - getNum(b.laptopKe);
        };

        const App = () => {
            const [activeTab, setActiveTab] = React.useState(1);
            const [isAdminOpen, setIsAdminOpen] = React.useState(false);
            const [adminAuth, setAdminAuth] = React.useState(false);
            const [passwordInput, setPasswordInput] = React.useState("");
            const [passwordError, setPasswordError] = React.useState("");
            
            // Data State
            const [data, setData] = React.useState({ lcd: [], laptop: [], pengajuan: [], bukuSisa: [], bukuHarga: [] });
            const [queueCount, setQueueCount] = React.useState(0);
            const [isOnline, setIsOnline] = React.useState(navigator.onLine);

            // Pagination State
            const [bukuSisaPage, setBukuSisaPage] = React.useState(1);
            const [bukuHargaPage, setBukuHargaPage] = React.useState(1);

            // Forms
            const [lcdForm, setLcdForm] = React.useState({ jenis: 'LCD', tanggal: '', kelas: '', jamPelajaran: '' });
            const [laptopForm, setLaptopForm] = React.useState({ laptopKe: '', tanggal: '', guru: '' });
            const [pengajuanForm, setPengajuanForm] = React.useState({ mapel: '', jumlah: '', kelas: '', namaSiswa: '' });
            const [editModal, setEditModal] = React.useState(null);
            const [deleteConfirm, setDeleteConfirm] = React.useState(null);

            // --- REFRESH DATA ---
            const refreshLocalData = async () => {
                const local = await LocalDB.getAll();
                if (local) {
                    setData(prev => ({ ...prev, ...local }));
                    setQueueCount(local.queueCount || 0);
                }
            };

            const runBackgroundSync = async () => {
                // 1. Fetch Latest from Server
                if (navigator.onLine) {
                    try {
                        const serverResult = await apiRequest('getAll');
                        if (serverResult.status === 'success') {
                            await LocalDB.mergeServerData(serverResult.data);
                            await refreshLocalData();
                        }
                    } catch (e) {
                        console.log("Background fetch skipped (network error)");
                    }
                    // 2. Process Queue
                    await SyncService.processQueue((count) => setQueueCount(count));
                }
            };

            React.useEffect(() => {
                // Initial Load
                refreshLocalData();
                runBackgroundSync();

                // Periodic Sync (Every 10 seconds)
                const interval = setInterval(runBackgroundSync, 10000);

                // Online/Offline Listeners
                const handleOnline = () => { setIsOnline(true); runBackgroundSync(); };
                const handleOffline = () => setIsOnline(false);
                
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);

                return () => {
                    clearInterval(interval);
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            // --- OPTIMISTIC ACTIONS ---
            // Aksi ini langsung update DB Lokal dan UI, lalu trigger sync background

            const handleLcdSubmit = async (e) => {
                e.preventDefault();
                const payload = { ...lcdForm, jamPelajaran: `'${lcdForm.jamPelajaran}` };
                await LocalDB.add('lcd', payload);
                setLcdForm({ jenis: 'LCD', tanggal: '', kelas: '', jamPelajaran: '' });
                await refreshLocalData(); // UI update instant
                SyncService.processQueue(setQueueCount); // Background sync trigger
            };

            const handleLaptopSubmit = async (e) => {
                e.preventDefault();
                await LocalDB.add('laptop', laptopForm);
                setLaptopForm({ laptopKe: '', tanggal: '', guru: '' });
                await refreshLocalData();
                SyncService.processQueue(setQueueCount);
            };

            const handlePengajuanSubmit = async (e) => {
                e.preventDefault();
                await LocalDB.add('pengajuan', { ...pengajuanForm, status: 'Tidak Ada' });
                setPengajuanForm({ mapel: '', jumlah: '', kelas: '', namaSiswa: '' });
                await refreshLocalData();
                SyncService.processQueue(setQueueCount);
            };

            const handleDeleteRequest = async () => {
                if (!deleteConfirm) return;
                const { type, id } = deleteConfirm;
                
                // Cari data existing untuk update flag deleteRequested
                let item = data[type].find(x => x.id === id);
                if (item) {
                     // Cloning item & adding flag
                     let payload = { ...item, deleteRequested: true };
                     // Fix apostrophe logic if needed
                     if (type === 'lcd' && payload.jamPelajaran && !String(payload.jamPelajaran).startsWith("'")) {
                         payload.jamPelajaran = `'${payload.jamPelajaran}`;
                     }
                     
                     // Use PUT (Update) not Delete, because it's just a request
                     await LocalDB.put(type, payload);
                }

                setDeleteConfirm(null);
                await refreshLocalData();
                SyncService.processQueue(setQueueCount);
            };

            const handleEditSave = async (e) => {
                e.preventDefault();
                if (!editModal) return;
                const { type, data: editedData } = editModal;
                
                let dataToSave = editedData;
                if (type === 'lcd' && !String(dataToSave.jamPelajaran).startsWith("'")) {
                    dataToSave = { ...dataToSave, jamPelajaran: `'${dataToSave.jamPelajaran}` };
                }

                await LocalDB.put(type, dataToSave);
                setEditModal(null);
                await refreshLocalData();
                SyncService.processQueue(setQueueCount);
            };

            const handleAdminAction = async (actionType, storeType, item) => {
                if (actionType === 'approveDelete') {
                    await LocalDB.delete(storeType, item.id);
                } else if (actionType === 'rejectDelete') {
                    let payload = { ...item, deleteRequested: false };
                    if (storeType === 'lcd' && payload.jamPelajaran && !String(payload.jamPelajaran).startsWith("'")) {
                        payload.jamPelajaran = `'${payload.jamPelajaran}`;
                    }
                    await LocalDB.put(storeType, payload);
                } else if (actionType === 'approvePengajuan') {
                    await LocalDB.put('pengajuan', { ...item, status: 'Sudah Ada' });
                }
                
                await refreshLocalData();
                SyncService.processQueue(setQueueCount);
            };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (passwordInput === ADMIN_PASSWORD) {
                    setAdminAuth(true);
                    setPasswordError("");
                    setIsAdminOpen(true);
                } else {
                    setPasswordError("Password salah!");
                }
            };

            // Render Tab Helpers
            const renderLcdTab = () => (
                <div className="space-y-6">
                    <div className="bg-white p-4 md:p-6 rounded-lg shadow-sm border border-gray-200">
                        <h3 className="text-lg font-bold text-gray-800 mb-4">Tambah Data Pengguna LCD / PID</h3>
                        <form onSubmit={handleLcdSubmit} className="grid grid-cols-1 md:grid-cols-5 gap-4">
                            <select className="border p-2 rounded w-full text-sm" value={lcdForm.jenis} onChange={e => setLcdForm({...lcdForm, jenis: e.target.value})}><option value="LCD">LCD</option><option value="PID">PID</option></select>
                            <input type="date" className="border p-2 rounded w-full text-sm" required value={lcdForm.tanggal} onChange={e => setLcdForm({...lcdForm, tanggal: e.target.value})}/>
                            <select className="border p-2 rounded w-full text-sm" required value={lcdForm.kelas} onChange={e => setLcdForm({...lcdForm, kelas: e.target.value})}>
                                <option value="">Pilih Kelas</option>
                                {[...Array(6)].map((_, i) => ['A','B','C','D'].map(char => (<option key={`${i+1}${char}`} value={`${i+1} ${char}`}>{i+1} {char}</option>)))}
                            </select>
                            <input type="text" placeholder="Jam ke... (4-5)" className="border p-2 rounded w-full text-sm" required value={lcdForm.jamPelajaran} onChange={e => setLcdForm({...lcdForm, jamPelajaran: e.target.value})}/>
                            <button className="bg-indigo-600 text-white p-2 rounded hover:bg-indigo-700 w-full text-sm font-medium">Tambah</button>
                        </form>
                    </div>
                    <Table
                        data={data.lcd.filter(x => !x.deleteRequested)}
                        columns={[
                            { header: 'Jenis', accessor: (item) => <span className={`px-2 py-1 rounded text-xs font-bold ${item.jenis === 'LCD' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'}`}>{item.jenis}</span> },
                            { header: 'Tanggal', accessor: (item) => formatDate(item.tanggal) },
                            { header: 'Kelas', accessor: (item) => item.kelas },
                            { header: 'Jam', accessor: (item) => formatJam(item.jamPelajaran) },
                        ]}
                        actions={(item) => (
                            <div className="flex justify-end gap-2">
                                <button onClick={() => setEditModal({ open: true, type: 'lcd', data: { ...item } })} className="text-blue-600 hover:underline text-xs md:text-sm">Edit</button>
                                <button onClick={() => setDeleteConfirm({ open: true, type: 'lcd', id: item.id })} className="text-red-600 hover:underline text-xs md:text-sm">Hapus</button>
                            </div>
                        )}
                    />
                </div>
            );

            const renderLaptopTab = () => {
                const sortedLaptopData = [...data.laptop].filter(x => !x.deleteRequested).sort(sortLaptopUnits);
                return (
                    <div className="space-y-6">
                        <div className="bg-white p-4 md:p-6 rounded-lg shadow-sm border border-gray-200">
                            <h3 className="text-lg font-bold text-gray-800 mb-4">Tambah Data Laptop</h3>
                            <form onSubmit={handleLaptopSubmit} className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <select className="border p-2 rounded w-full text-sm" required value={laptopForm.laptopKe} onChange={e => setLaptopForm({...laptopForm, laptopKe: e.target.value})}>
                                    <option value="">Pilih Laptop</option>
                                    {[...Array(8)].map((_, i) => <option key={i} value={`Laptop ${i+1}`}>Laptop {i+1}</option>)}
                                </select>
                                <input type="date" className="border p-2 rounded w-full text-sm" required value={laptopForm.tanggal} onChange={e => setLaptopForm({...laptopForm, tanggal: e.target.value})}/>
                                <select className="border p-2 rounded w-full text-sm" required value={laptopForm.guru} onChange={e => setLaptopForm({...laptopForm, guru: e.target.value})}>
                                    <option value="">Pilih Guru</option>
                                    {GURU_LIST.map(g => <option key={g} value={g}>{g}</option>)}
                                </select>
                                <button className="bg-indigo-600 text-white p-2 rounded hover:bg-indigo-700 w-full text-sm font-medium">Tambah</button>
                            </form>
                        </div>
                        <Table
                            data={sortedLaptopData}
                            columns={[
                                { header: 'Unit', accessor: (item) => item.laptopKe },
                                { header: 'Tanggal', accessor: (item) => formatDate(item.tanggal) },
                                { header: 'Peminjam', accessor: (item) => item.guru },
                            ]}
                            actions={(item) => (
                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setEditModal({ open: true, type: 'laptop', data: { ...item } })} className="text-blue-600 hover:underline text-xs md:text-sm">Edit</button>
                                    <button onClick={() => setDeleteConfirm({ open: true, type: 'laptop', id: item.id })} className="text-red-600 hover:underline text-xs md:text-sm">Hapus</button>
                                </div>
                            )}
                        />
                    </div>
                );
            };

            const renderBukuTab = () => {
                const renderMatrixTable = (title, tableData, type, page, setPage) => {
                    const ITEMS_PER_PAGE = 5;
                    const filteredData = tableData.filter(r => !r.deleteRequested);
                    const totalPages = Math.ceil(filteredData.length / ITEMS_PER_PAGE);
                    const safePage = page > totalPages && totalPages > 0 ? totalPages : page;
                    const startIndex = (safePage - 1) * ITEMS_PER_PAGE;
                    const paginatedData = filteredData.slice(startIndex, startIndex + ITEMS_PER_PAGE);

                    return (
                    <div className="mb-8">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-bold text-gray-800">{title}</h3>
                            <button 
                                onClick={async () => {
                                    await LocalDB.add(type, { mapel: 'Baru', k1: '', k2: '', k3: '', k4: '', k5: '', k6: '' });
                                    await refreshLocalData();
                                    SyncService.processQueue(setQueueCount);
                                    // Jump to last page logic omitted for brevity/speed
                                }}
                                className="text-xs md:text-sm bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700"
                            >+ Baris</button>
                        </div>
                        <div className="overflow-x-auto border rounded-lg shadow-sm">
                            <table className="w-full text-sm text-left text-gray-500">
                                <thead className="text-xs text-white uppercase bg-indigo-600">
                                    <tr>
                                        <th className="px-2 py-2 md:px-4 md:py-3 whitespace-nowrap">Mapel</th>
                                        {[1,2,3,4,5,6].map(k => <th key={k} className="px-2 py-2 md:px-4 md:py-3 text-center whitespace-nowrap">Kls {k}</th>)}
                                        <th className="px-2 py-2 md:px-4 md:py-3 text-right whitespace-nowrap">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-gray-200">
                                    {paginatedData.length === 0 ? <tr><td colSpan={8} className="text-center py-4 text-gray-500">Tidak ada data</td></tr> : (
                                        paginatedData.map((row) => (
                                            <tr key={row.id} className="hover:bg-gray-50">
                                                <td className="px-2 py-2 md:px-4 md:py-2 font-medium text-gray-900 cursor-pointer hover:text-indigo-600 whitespace-nowrap" onClick={() => setEditModal({ open: true, type, data: {...row} })}>{row.mapel}</td>
                                                {['k1','k2','k3','k4','k5','k6'].map(k => (
                                                    <td key={k} className="px-2 py-2 md:px-4 md:py-2 text-center cursor-pointer hover:bg-indigo-50 whitespace-nowrap text-xs md:text-sm" onClick={() => setEditModal({ open: true, type, data: {...row} })}>
                                                        {type === 'bukuHarga' && row[k] ? formatCurrency(row[k]) : row[k] || '-'}
                                                    </td>
                                                ))}
                                                <td className="px-2 py-2 md:px-4 md:py-2 text-right whitespace-nowrap">
                                                    <button onClick={() => setDeleteConfirm({ open: true, type, id: row.id })} className="text-red-600 hover:underline text-xs">Hapus</button>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                        {totalPages > 1 && (
                            <div className="flex justify-between items-center mt-4 px-1">
                                <span className="text-xs text-gray-500">Halaman {safePage} dari {totalPages}</span>
                                <div className="flex gap-2">
                                    <button onClick={() => setPage(Math.max(1, safePage - 1))} disabled={safePage === 1} className="px-3 py-1 text-xs border rounded bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">Sebelumnya</button>
                                    <button onClick={() => setPage(Math.min(totalPages, safePage + 1))} disabled={safePage === totalPages} className="px-3 py-1 text-xs border rounded bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">Selanjutnya</button>
                                </div>
                            </div>
                        )}
                    </div>
                    );
                };

                return (
                    <div className="space-y-8">
                        {renderMatrixTable('Daftar Sisa Buku', data.bukuSisa, 'bukuSisa', bukuSisaPage, setBukuSisaPage)}
                        {renderMatrixTable('Daftar Harga Buku', data.bukuHarga, 'bukuHarga', bukuHargaPage, setBukuHargaPage)}
                        <div className="bg-white p-4 md:p-6 rounded-lg shadow-sm border border-gray-200">
                            <h3 className="text-lg font-bold text-gray-800 mb-4">Form Pengajuan Buku</h3>
                            <form onSubmit={handlePengajuanSubmit} className="grid grid-cols-1 md:grid-cols-5 gap-4">
                                <input type="text" placeholder="Mapel" className="border p-2 rounded w-full text-sm" required value={pengajuanForm.mapel} onChange={e => setPengajuanForm({...pengajuanForm, mapel: e.target.value})}/>
                                <input type="number" placeholder="Jumlah" className="border p-2 rounded w-full text-sm" required value={pengajuanForm.jumlah} onChange={e => setPengajuanForm({...pengajuanForm, jumlah: e.target.value})}/>
                                <select className="border p-2 rounded w-full text-sm" required value={pengajuanForm.kelas} onChange={e => setPengajuanForm({...pengajuanForm, kelas: e.target.value})}>
                                    <option value="">Pilih Kelas</option>
                                    {[...Array(6)].map((_, i) => ['A','B','C','D'].map(char => (<option key={`${i+1}${char}`} value={`${i+1} ${char}`}>{i+1} {char}</option>)))}
                                </select>
                                <input type="text" placeholder="Nama Siswa" className="border p-2 rounded w-full text-sm" required value={pengajuanForm.namaSiswa} onChange={e => setPengajuanForm({...pengajuanForm, namaSiswa: e.target.value})}/>
                                <button className="bg-indigo-600 text-white p-2 rounded hover:bg-indigo-700 w-full text-sm font-medium">Ajukan</button>
                            </form>
                            <div className="mt-4 text-xs md:text-sm text-gray-600 italic bg-gray-50 p-3 rounded border border-gray-100"><span className="font-bold text-gray-700">Catatan:</span> Apabila stok buku pada daftar sisa buku tidak tersedia atau telah habis, silakan mengajukan permohonan penambahan.</div>
                        </div>
                        <div className="mt-4">
                            <h3 className="text-lg font-bold text-gray-800 mb-4">Daftar Pengajuan</h3>
                            <Table
                                data={data.pengajuan.filter(x => !x.deleteRequested)}
                                columns={[
                                    { header: 'Mapel', accessor: (item) => item.mapel },
                                    { header: 'Jumlah', accessor: (item) => item.jumlah },
                                    { header: 'Kelas', accessor: (item) => item.kelas },
                                    { header: 'Siswa', accessor: (item) => item.namaSiswa },
                                    { header: 'Status', accessor: (item) => <span className={`px-2 py-1 rounded text-xs ${item.status === 'Sudah Ada' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}`}>{item.status}</span> },
                                ]}
                                actions={(item) => (
                                    <div className="flex justify-end gap-2">
                                        <button disabled={item.status === 'Sudah Ada'} onClick={() => setEditModal({ open: true, type: 'pengajuan', data: { ...item } })} className="text-blue-600 hover:underline disabled:text-gray-400 text-xs md:text-sm">Edit</button>
                                        <button onClick={() => setDeleteConfirm({ open: true, type: 'pengajuan', id: item.id })} className="text-red-600 hover:underline text-xs md:text-sm">Hapus</button>
                                    </div>
                                )}
                            />
                        </div>
                    </div>
                );
            };

            const renderAdminPanel = () => {
                const deletions = [
                    ...data.lcd.filter(x => x.deleteRequested).map(x => ({...x, _type: 'lcd', _desc: `LCD: ${x.jenis} - ${formatDate(x.tanggal)}`})),
                    ...data.laptop.filter(x => x.deleteRequested).map(x => ({...x, _type: 'laptop', _desc: `Laptop: ${x.laptopKe} - ${formatDate(x.tanggal)}`})),
                    ...data.pengajuan.filter(x => x.deleteRequested).map(x => ({...x, _type: 'pengajuan', _desc: `Pengajuan: ${x.mapel} - ${x.namaSiswa}`})),
                    ...data.bukuSisa.filter(x => x.deleteRequested).map(x => ({...x, _type: 'bukuSisa', _desc: `Sisa Buku: ${x.mapel}`})),
                    ...data.bukuHarga.filter(x => x.deleteRequested).map(x => ({...x, _type: 'bukuHarga', _desc: `Harga Buku: ${x.mapel}`})),
                ];
                const pendingPengajuan = data.pengajuan.filter(x => x.status === 'Tidak Ada' && !x.deleteRequested);

                return (
                    <div className="space-y-8">
                        <div>
                            <h4 className="font-bold text-lg mb-2">Permintaan Hapus ({deletions.length})</h4>
                            {deletions.length === 0 ? <p className="text-gray-500 italic text-sm">Tidak ada permintaan.</p> : (
                                <ul className="space-y-2">
                                    {deletions.map(item => (
                                        <li key={item.id} className="bg-red-50 p-3 rounded border border-red-100 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2">
                                            <span className="text-sm break-words">{item._desc}</span>
                                            <div className="flex gap-2 self-end sm:self-auto shrink-0">
                                                <button onClick={() => handleAdminAction('rejectDelete', item._type, item)} className="text-xs bg-gray-200 px-2 py-1 rounded hover:bg-gray-300">Tolak</button>
                                                <button onClick={() => handleAdminAction('approveDelete', item._type, item)} className="text-xs bg-red-600 text-white px-2 py-1 rounded hover:bg-red-700">Setujui</button>
                                            </div>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                        <div>
                            <h4 className="font-bold text-lg mb-2">Validasi Pengajuan Buku ({pendingPengajuan.length})</h4>
                            {pendingPengajuan.length === 0 ? <p className="text-gray-500 italic text-sm">Semua pengajuan sudah diproses.</p> : (
                                <ul className="space-y-2">
                                    {pendingPengajuan.map(item => (
                                        <li key={item.id} className="bg-yellow-50 p-3 rounded border border-yellow-100 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2">
                                            <span className="text-sm break-words">{item.mapel} - {item.namaSiswa} ({item.jumlah})</span>
                                            <button onClick={() => handleAdminAction('approvePengajuan', 'pengajuan', item)} className="text-xs bg-green-600 text-white px-2 py-1 rounded hover:bg-green-700 self-end sm:self-auto shrink-0">Ubah Status Ada</button>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col max-w-6xl mx-auto p-2 md:p-4">
                    <header className="bg-white rounded-xl shadow-sm p-4 md:p-6 mb-4 md:mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
                        <div className="text-center md:text-left">
                            <h1 className="text-xl md:text-2xl font-extrabold text-indigo-900">
                                INVENTARIS SEKOLAH & MANAJEMEN BUKU
                            </h1>
                            <div className="flex items-center gap-2 text-xs font-medium mt-1 justify-center md:justify-start">
                                {isOnline ? <span className="text-green-600">● Online</span> : <span className="text-red-500">● Offline</span>}
                                {queueCount > 0 ? (
                                    <span className="text-yellow-600 bg-yellow-50 px-2 py-0.5 rounded-full border border-yellow-200 animate-pulse">
                                        ⏳ {queueCount} Antrean Sync
                                    </span>
                                ) : (
                                    <span className="text-gray-400">✓ Ter-sync</span>
                                )}
                            </div>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                            <button onClick={() => { setPasswordInput(""); setIsAdminOpen(true); }} className="flex items-center gap-2 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full transition-colors text-sm font-medium">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg> Admin
                            </button>
                        </div>
                    </header>

                    <nav className="flex bg-white rounded-t-lg border-b border-gray-200 overflow-hidden shadow-sm">
                        {[ { id: 1, label: 'LCD / PID' }, { id: 2, label: 'LAPTOP' }, { id: 3, label: 'BUKU' } ].map(tab => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex-1 py-3 md:py-4 text-xs md:text-sm font-bold tracking-wide transition-colors ${activeTab === tab.id ? 'bg-indigo-50 text-indigo-700 border-b-2 border-indigo-600' : 'text-gray-500 hover:bg-gray-50'}`}>
                                {tab.label}
                            </button>
                        ))}
                    </nav>

                    <main className="bg-white p-4 md:p-6 rounded-b-lg shadow-sm min-h-[500px]">
                        {activeTab === 1 && renderLcdTab()}
                        {activeTab === 2 && renderLaptopTab()}
                        {activeTab === 3 && renderBukuTab()}
                    </main>

                    <Modal isOpen={!!deleteConfirm} onClose={() => setDeleteConfirm(null)} title="Konfirmasi Hapus">
                        <p className="mb-6 text-gray-600">Apakah Anda yakin ingin mengajukan penghapusan data ini ke Admin?</p>
                        <div className="flex justify-end gap-3">
                            <button onClick={() => setDeleteConfirm(null)} className="px-4 py-2 bg-gray-200 rounded text-gray-700 text-sm">Batal</button>
                            <button onClick={handleDeleteRequest} className="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 text-sm">Ya, Ajukan Hapus</button>
                        </div>
                    </Modal>

                    <Modal isOpen={!!editModal} onClose={() => setEditModal(null)} title="Edit Data">
                        {editModal && (
                        <form onSubmit={handleEditSave} className="space-y-4">
                            {editModal.type === 'lcd' && (
                                <>
                                    <div className="flex flex-col"><label className="text-xs text-gray-500 mb-1">Jenis</label>
                                    <select className="border p-2 rounded text-sm" value={editModal.data.jenis} onChange={e => setEditModal({...editModal, data: {...editModal.data, jenis: e.target.value}})}><option value="LCD">LCD</option><option value="PID">PID</option></select></div>
                                    <div className="flex flex-col"><label className="text-xs text-gray-500 mb-1">Tanggal</label>
                                    <input className="border p-2 rounded text-sm" type="date" value={editModal.data.tanggal.split('T')[0]} onChange={e => setEditModal({...editModal, data: {...editModal.data, tanggal: e.target.value}})} /></div>
                                    <div className="flex flex-col"><label className="text-xs text-gray-500 mb-1">Kelas</label>
                                    <select className="border p-2 rounded text-sm" value={editModal.data.kelas} onChange={e => setEditModal({...editModal, data: {...editModal.data, kelas: e.target.value}})}><option value="">Pilih Kelas</option>{[...Array(6)].map((_, i) => ['A','B','C','D'].map(char => <option key={`${i+1}${char}`} value={`${i+1} ${char}`}>{i+1} {char}</option>))}</select></div>
                                    <div className="flex flex-col"><label className="text-xs text-gray-500 mb-1">Jam</label>
                                    <input className="border p-2 rounded text-sm" value={editModal.data.jamPelajaran} onChange={e => setEditModal({...editModal, data: {...editModal.data, jamPelajaran: e.target.value}})} /></div>
                                </>
                            )}
                            {editModal.type === 'laptop' && (
                                <>
                                    <div className="flex flex-col"><label className="text-xs text-gray-500 mb-1">Unit</label>
                                    <input className="border p-2 rounded text-sm" value={editModal.data.laptopKe} onChange={e => setEditModal({...editModal, data: {...editModal.data, laptopKe: e.target.value}})} /></div>
                                    <div className="flex flex-col"><label className="text-xs text-gray-500 mb-1">Tanggal</label>
                                    <input className="border p-2 rounded text-sm" type="date" value={editModal.data.tanggal ? editModal.data.tanggal.split('T')[0] : ''} onChange={e => setEditModal({...editModal, data: {...editModal.data, tanggal: e.target.value}})} /></div>
                                    <div className="flex flex-col"><label className="text-xs text-gray-500 mb-1">Guru</label>
                                    <select className="border p-2 rounded text-sm" value={editModal.data.guru} onChange={e => setEditModal({...editModal, data: {...editModal.data, guru: e.target.value}})}>{GURU_LIST.map(g => <option key={g} value={g}>{g}</option>)}</select></div>
                                </>
                            )}
                            {(editModal.type === 'bukuSisa' || editModal.type === 'bukuHarga') && (
                                <>
                                    <div className="flex flex-col"><label className="text-xs text-gray-500 mb-1">Mapel</label>
                                    <input className="border p-2 rounded text-sm" value={editModal.data.mapel} onChange={e => setEditModal({...editModal, data: {...editModal.data, mapel: e.target.value}})} /></div>
                                    {['k1','k2','k3','k4','k5','k6'].map(k => (
                                        <div key={k} className="flex flex-col"><label className="text-xs text-gray-500 mb-1">Kelas {k.replace('k','')}</label>
                                        <input className="border p-2 rounded text-sm" value={editModal.data[k]} onChange={e => setEditModal({...editModal, data: {...editModal.data, [k]: e.target.value}})} /></div>
                                    ))}
                                </>
                            )}
                            {editModal.type === 'pengajuan' && (
                                <>
                                    <div className="flex flex-col"><label className="text-xs text-gray-500 mb-1">Mapel</label>
                                    <input className="border p-2 rounded text-sm" value={editModal.data.mapel} onChange={e => setEditModal({...editModal, data: {...editModal.data, mapel: e.target.value}})} /></div>
                                    <div className="flex flex-col"><label className="text-xs text-gray-500 mb-1">Jumlah</label>
                                    <input className="border p-2 rounded text-sm" type="number" value={editModal.data.jumlah} onChange={e => setEditModal({...editModal, data: {...editModal.data, jumlah: Number(e.target.value)}})} /></div>
                                    <div className="flex flex-col"><label className="text-xs text-gray-500 mb-1">Kelas</label>
                                    <select className="border p-2 rounded text-sm" value={editModal.data.kelas} onChange={e => setEditModal({...editModal, data: {...editModal.data, kelas: e.target.value}})}><option value="">Pilih Kelas</option>{[...Array(6)].map((_, i) => ['A','B','C','D'].map(char => <option key={`${i+1}${char}`} value={`${i+1} ${char}`}>{i+1} {char}</option>))}</select></div>
                                    <div className="flex flex-col"><label className="text-xs text-gray-500 mb-1">Nama Siswa</label>
                                    <input className="border p-2 rounded text-sm" value={editModal.data.namaSiswa} onChange={e => setEditModal({...editModal, data: {...editModal.data, namaSiswa: e.target.value}})} /></div>
                                </>
                            )}
                            <div className="flex justify-end gap-3 pt-4 border-t mt-2">
                                <button type="button" onClick={() => setEditModal(null)} className="px-4 py-2 bg-gray-200 rounded text-gray-700 text-sm">Batal</button>
                                <button type="submit" className="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 text-sm">Simpan</button>
                            </div>
                        </form>
                        )}
                    </Modal>

                    <Modal isOpen={isAdminOpen} onClose={() => setIsAdminOpen(false)} title="Panel Admin">
                        {!adminAuth ? (
                        <form onSubmit={handleAdminLogin} className="space-y-4">
                            <p className="text-sm text-gray-600">Masukkan password untuk mengakses panel admin.</p>
                            <input type="password" className="w-full border p-2 rounded focus:ring-2 focus:ring-indigo-500 outline-none text-sm" placeholder="Password..." value={passwordInput} onChange={e => setPasswordInput(e.target.value)} />
                            {passwordError && <p className="text-red-500 text-sm">{passwordError}</p>}
                            <div className="flex justify-end">
                                <button type="submit" className="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 text-sm">Login</button>
                            </div>
                        </form>
                        ) : (
                        <div className="max-h-[60vh] pr-2">
                            {renderAdminPanel()}
                            <div className="mt-6 pt-4 border-t text-right">
                                <button onClick={() => setAdminAuth(false)} className="text-sm text-gray-500 underline">Logout</button>
                            </div>
                        </div>
                        )}
                    </Modal>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
